# Publish a Music-Prod Studio macOS release — one click, no pasted token.
#
# WHAT THIS DOES
#   Runs the SAME publication the operator used to run by hand
#   (Scripts/publish-release.sh: the deployed admin lifecycle, every digest
#   check, every STOP), with the differences that are the whole point:
#
#     1. The credential is a MACHINE credential — the release publisher
#        credential, held as this environment's MPS_PUBLISHER_TOKEN secret.
#        No human Magic Link access token is retrieved, pasted or stored.
#     2. The artifact identity is asserted from THREE independent sources: the
#        values typed into this form, the PUBLIC production catalog (for an
#        already-published candidate), and the SHA-256 of the bytes that arrive.
#        A disagreement is a refusal, never a guess.
#     3. The artifact is then proved to be a real release FROM ITS OWN BYTES —
#        bundle version/build, code signature, hardened runtime, stapled
#        notarization ticket, and the Gatekeeper verdict — plus the packaged
#        startup-critical resource gate the publisher script runs on the shipped
#        ZIP. Those facts are read out of the artifact instead of being taken
#        from a release record, because the record is generated by a private
#        signing pipeline and must never be mirrored here (see README.md).
#
# WHERE THE CANDIDATE COMES FROM (candidate_source)
#   `release-asset` (default)
#     The single `Music-Prod-Studio-<version>-<build>.zip` attached to the GitHub
#     Release `candidate_tag` OF THIS REPOSITORY. The operator attaches the
#     notarized ZIP here before publishing. Nothing is read from any private
#     repository, so this workflow needs no access to one.
#   `published`
#     The candidate is the artifact the PUBLIC production catalog already serves
#     for this version, fetched through `GET /downloads/authorize` with no
#     credential at all (the deployed policy for this product is `public`). This
#     is the attest / inspection path: it proves an already-published release's
#     bytes are the ones this run would have published. A version that is not
#     published yet is refused with that exact reason.
#
# THE HUMAN GATE
#   Publication is never automatic:
#     * `workflow_dispatch` means a human starts it (nothing runs on a push or a
#       pull request, so a secret can never reach an unreviewed event);
#     * the job runs in the `production` ENVIRONMENT, which must be configured
#       with required reviewers — GitHub holds the job (and withholds the
#       credential) until a reviewer approves it;
#     * the `confirm` input must repeat the version exactly, so a mistyped run
#       cannot publish;
#     * `MPS_PUBLISH_AUTOMATION_READY` must be `true` (a repository variable),
#       the operator's own statement that the environment's protection and
#       secrets are configured. Without it the job refuses to run rather than
#       publishing under an unverified configuration.
#     * the script sets MPS_REQUIRE_PUBLISHER_CREDENTIAL=1, so it CANNOT fall
#       back to a human access token even if one is left in a secret.
#
# Run it from Actions -> "Publish release" -> Run workflow. Nothing is published
# until the reviewer(s) approve the run, and `dry_run` stops at
# `INSPECTION ONLY — nothing was modified`.
#
# Setup, rotation and the exact manual steps: README.md

name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to publish, e.g. 2.0.14'
        required: true
        type: string
      build_number:
        description: 'Build number, e.g. 16 (from the release record)'
        required: true
        type: string
      previous_version:
        description: 'The version production serves now, e.g. 2.0.13 (untouched, remains the fallback)'
        required: true
        type: string
      candidate_source:
        description: 'Where the notarized candidate comes from: release-asset (this repository) or published (the live production catalog)'
        required: true
        default: release-asset
        type: choice
        options:
          - release-asset
          - published
      candidate_tag:
        description: 'GitHub Release tag here holding the notarized ZIP (used when candidate_source is release-asset)'
        required: false
        default: release-candidate
        type: string
      artifact_sha256:
        description: 'SHA-256 of the FINAL post-staple ZIP (must match the bytes that are fetched)'
        required: true
        type: string
      artifact_size:
        description: 'Size of the FINAL post-staple ZIP in bytes'
        required: true
        type: string
      release_notes:
        description: 'Release notes recorded on the release (what users are shown)'
        required: true
        type: string
      product_id:
        description: 'Optional: the product UUID to require (recommended; otherwise it is derived from the published previous release)'
        required: false
        type: string
      confirm:
        description: 'Type the version again to confirm (must equal `version`)'
        required: true
        type: string
      dry_run:
        description: 'Inspect only: walk the read-only checks and stop (nothing is created or mutated)'
        required: true
        default: false
        type: boolean

# One publication at a time — including inspection runs, which must not race a
# real publication of the same or another version. A queued run waits.
concurrency:
  group: release-publication
  cancel-in-progress: false

# Least privilege: this workflow reads this repository's content and its own
# release assets. It writes nothing to GitHub, and the credential it holds is
# scoped SERVER-SIDE to the release publication routes.
permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.version }}
    runs-on: macos-14
    timeout-minutes: 45
    # The approval gate. Configure required reviewers on this environment; the
    # job (and therefore MPS_PUBLISHER_TOKEN) is withheld until they approve.
    environment:
      name: production
      url: https://music-prod.com
    env:
      # The credential arrives only through the environment and leaves through a
      # `curl -K -` stdin config; it is never an argument, never traced, never
      # logged (asserted by a step below).
      MPS_PUBLISHER_TOKEN: ${{ secrets.MPS_PUBLISHER_TOKEN }}
      # The automation must never fall back to a human access token.
      MPS_REQUIRE_PUBLISHER_CREDENTIAL: '1'
      # The packaged-resource gate compares the shipped AppIcon.icns with the
      # pinned public favicon. The pin is checked in the "Verify the pinned icon
      # reference" step before anything else uses this file.
      MPS_ICON_REFERENCE: ${{ github.workspace }}/assets/music-prod-favicon.png

    steps:
      - name: Refuse to run unless the release environment is declared ready
        env:
          READY: ${{ vars.MPS_PUBLISH_AUTOMATION_READY }}
        run: |
          set -euo pipefail
          if [ "${READY:-}" != "true" ]; then
            echo "REFUSED: the repository variable MPS_PUBLISH_AUTOMATION_READY is not 'true'." >&2
            echo "" >&2
            echo "Set it only after the 'production' environment has:" >&2
            echo "  * required reviewers (the manual approval gate)," >&2
            echo "  * the secret MPS_PUBLISHER_TOKEN (a publisher credential token)," >&2
            echo "and after the backend release-publisher credential is deployed and" >&2
            echo "RELEASE_PUBLISHER_ACTOR_ID is set." >&2
            echo "See README.md." >&2
            exit 1
          fi

      - name: Validate the request
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA: ${{ inputs.artifact_sha256 }}
          EXPECTED_SIZE: ${{ inputs.artifact_size }}
          CONFIRM: ${{ inputs.confirm }}
          PRODUCT_ID: ${{ inputs.product_id }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
        run: |
          set -euo pipefail
          fail() { echo "REFUSED: $1" >&2; exit 1; }
          echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || fail "version '$VERSION' is not x.y.z"
          echo "$PREVIOUS_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$' || fail "previous_version '$PREVIOUS_VERSION' is not x.y.z"
          echo "$BUILD_NUMBER" | grep -qE '^[0-9]+$' || fail "build_number '$BUILD_NUMBER' is not numeric"
          echo "$EXPECTED_SHA" | grep -qE '^[0-9a-f]{64}$' || fail "artifact_sha256 must be 64 lowercase hex characters"
          echo "$EXPECTED_SIZE" | grep -qE '^[0-9]+$' || fail "artifact_size must be a whole number of bytes"
          [ "$VERSION" != "$PREVIOUS_VERSION" ] || fail "version and previous_version are the same"
          [ "$CONFIRM" = "$VERSION" ] || fail "confirm ('$CONFIRM') does not match version ('$VERSION')"
          case "$CANDIDATE_SOURCE" in
            release-asset|published) ;;
            *) fail "candidate_source '$CANDIDATE_SOURCE' is not release-asset or published" ;;
          esac
          if [ -n "$PRODUCT_ID" ]; then
            echo "$PRODUCT_ID" | grep -qiE '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' \
              || fail "product_id is not a UUID"
          fi
          echo "request validated for $VERSION build $BUILD_NUMBER (previous $PREVIOUS_VERSION, candidate from $CANDIDATE_SOURCE)"

      - name: Check out the publisher tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
        with:
          fetch-depth: 1
          # Nothing here writes to the repository, so the token is not left
          # behind in the checkout's git config.
          persist-credentials: false

      - name: Verify the pinned icon reference
        run: |
          set -euo pipefail
          # The packaged-icon check is only meaningful against the genuine
          # artwork, so the reference it compares with is pinned here by digest.
          # The pin is the digest of https://music-prod.com/favicon.png, the same
          # one the application build pins.
          EXPECTED="2bcce3c806ca8434cb4e8c283c88df849078bd2d3775fa23ed3744daf89305b9"
          ACTUAL="$(shasum -a 256 "$MPS_ICON_REFERENCE" | awk '{print $1}')"
          [ "$ACTUAL" = "$EXPECTED" ] \
            || { echo "REFUSED: the icon reference is not the pinned music-prod.com favicon (sha256 $ACTUAL, expected $EXPECTED)." >&2; exit 1; }
          echo "icon reference verified: $(basename "$MPS_ICON_REFERENCE") sha256 $ACTUAL"

      - name: Fetch the notarized candidate
        env:
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          CANDIDATE_TAG: ${{ inputs.candidate_tag }}
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA: ${{ inputs.artifact_sha256 }}
          EXPECTED_SIZE: ${{ inputs.artifact_size }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          if [ "$CANDIDATE_SOURCE" = "published" ]; then
            # No credential, no private repository: the public catalog and the
            # public download-authorization route the release service already
            # exposes. Unsuitable for a version that is not published yet, and it
            # says so rather than fetching something else.
            Scripts/fetch-published-candidate.sh \
              --version "$VERSION" --build "$BUILD_NUMBER" \
              --expect-sha "$EXPECTED_SHA" --expect-size "$EXPECTED_SIZE" \
              --out candidate
          else
            gh release download "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --dir candidate --pattern '*.zip' \
              || { echo "REFUSED: no candidate ZIP on release '$CANDIDATE_TAG' of $GITHUB_REPOSITORY." >&2; exit 1; }
            zips="$(find candidate -maxdepth 1 -name '*.zip' | wc -l | tr -d ' ')"
            [ "$zips" = "1" ] || { echo "REFUSED: expected exactly one candidate ZIP on '$CANDIDATE_TAG', found $zips." >&2; exit 1; }
            # The name must carry the version and build the run claims, so a stale
            # candidate cannot be published under a new version number.
            find candidate -maxdepth 1 -name '*.zip' -print | grep -qE "/Music-Prod-Studio-${VERSION}-${BUILD_NUMBER}\.zip$" \
              || { echo "REFUSED: the candidate ZIP is not named Music-Prod-Studio-${VERSION}-${BUILD_NUMBER}.zip." >&2; exit 1; }
          fi
          ls -l candidate

      - name: Verify the bytes, and prove the artifact is a notarized release from its own contents
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          EXPECTED_SHA: ${{ inputs.artifact_sha256 }}
          EXPECTED_SIZE: ${{ inputs.artifact_size }}
        run: |
          set -euo pipefail
          fail() { echo "REFUSED: $1" >&2; exit 1; }
          ZIP="$(find candidate -maxdepth 1 -name '*.zip' -print -quit)"
          ACTUAL_SHA="$(shasum -a 256 "$ZIP" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -f '%z' "$ZIP")"
          [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ] || fail "the fetched bytes hash to $ACTUAL_SHA, not $EXPECTED_SHA."
          [ "$ACTUAL_SIZE" = "$EXPECTED_SIZE" ] || fail "the fetched file is $ACTUAL_SIZE bytes, not $EXPECTED_SIZE."
          echo "bytes verified: $ZIP"
          echo "  sha256 $ACTUAL_SHA"
          echo "  size   $ACTUAL_SIZE bytes"

          # From here on, every claim about this artifact is read out of the
          # artifact itself. A release record would say the same things; the bytes
          # cannot be wrong about themselves.
          EXTRACT="$RUNNER_TEMP/extracted"
          rm -rf "$EXTRACT"; mkdir -p "$EXTRACT"
          ditto -x -k "$ZIP" "$EXTRACT" || fail "the candidate could not be extracted."
          APP="$(find "$EXTRACT" -maxdepth 1 -name '*.app' -type d | head -1)"
          [ -n "$APP" ] || fail "the candidate contains no .app bundle at its top level."

          PLIST="$APP/Contents/Info.plist"
          BUNDLE_VERSION="$(plutil -extract CFBundleShortVersionString raw -o - "$PLIST" 2>/dev/null || true)"
          BUNDLE_BUILD="$(plutil -extract CFBundleVersion raw -o - "$PLIST" 2>/dev/null || true)"
          BUNDLE_ID="$(plutil -extract CFBundleIdentifier raw -o - "$PLIST" 2>/dev/null || true)"
          [ "$BUNDLE_VERSION" = "$VERSION" ] || fail "the packaged app reports version '${BUNDLE_VERSION:-<missing>}', this run publishes $VERSION."
          [ "$BUNDLE_BUILD" = "$BUILD_NUMBER" ] || fail "the packaged app reports build '${BUNDLE_BUILD:-<missing>}', this run publishes build $BUILD_NUMBER."
          echo "bundle: $BUNDLE_ID version $BUNDLE_VERSION (build $BUNDLE_BUILD)"

          codesign --verify --deep --strict --verbose=2 "$APP" \
            || fail "codesign --verify --deep --strict FAILED for the packaged app — this is not a signed release."
          SIGN_INFO="$(codesign -dv --verbose=4 "$APP" 2>&1 || true)"
          printf '%s\n' "$SIGN_INFO" | grep -q '^Authority=Developer ID Application' \
            || fail "the app is not signed with a Developer ID Application certificate — a development or ad-hoc build is not publishable."
          printf '%s\n' "$SIGN_INFO" | grep -q 'flags=.*runtime' \
            || fail "Hardened Runtime is not enabled on the packaged app."
          printf '%s\n' "$SIGN_INFO" | grep -m1 '^Authority=' | sed 's/^/  /'

          STAPLE="$(xcrun stapler validate "$APP" 2>&1 || true)"
          case "$STAPLE" in
            *"The validate action worked"*) echo "  notarization ticket: stapled" ;;
            *) fail "no stapled notarization ticket was confirmed — an unstapled artifact is not a publication identity." ;;
          esac

          SPCTL="$(spctl -a -vvv -t install "$APP" 2>&1 || true)"
          case "$SPCTL" in
            *accepted*) echo "  Gatekeeper: accepted" ;;
            *) printf '%s\n' "$SPCTL" >&2; fail "Gatekeeper does NOT accept the packaged app — this must never reach a user." ;;
          esac
          echo "the artifact is a signed, hardened, notarized, stapled release — proved from its own bytes"

      - name: Publish through the deployed lifecycle
        env:
          VERSION: ${{ inputs.version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          PRODUCT_ID: ${{ inputs.product_id }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          EXPECTED_SHA: ${{ inputs.artifact_sha256 }}
          EXPECTED_SIZE: ${{ inputs.artifact_size }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ZIP="$(find candidate -maxdepth 1 -name '*.zip' -print -quit)"
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.txt"
          args=( --version "$VERSION"
                 --build "$BUILD_NUMBER"
                 --previous-version "$PREVIOUS_VERSION"
                 --zip "$ZIP"
                 --sha256 "$EXPECTED_SHA"
                 --size "$EXPECTED_SIZE"
                 --release-notes-file "$RUNNER_TEMP/release-notes.txt" )
          if [ -n "$PRODUCT_ID" ]; then
            args+=( --product-id "$PRODUCT_ID" )
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=( --inspect )
          fi
          # The credential arrives only through the environment and leaves through
          # a `curl -K -` stdin config. The log is captured for the run's evidence.
          set +e
          Scripts/publish-release.sh "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/publish.log"
          status=${PIPESTATUS[0]}
          set -e
          echo "publish-release.sh exited $status"
          exit "$status"

      - name: Assert the credential never appeared in the output
        if: always()
        env:
          PUBLISH_LOG: ${{ runner.temp }}/publish.log
        run: |
          set -euo pipefail
          # One line, and the credential is read from the environment: it must
          # never be an argument, not even to this check.
          python3 -c 'import os,sys; t=os.environ.get("MPS_PUBLISHER_TOKEN",""); d=open(sys.argv[1],encoding="utf-8",errors="replace").read(); sys.exit(1 if (t and t in d) else 0)' "$PUBLISH_LOG" \
            || { echo "REFUSED: the publisher credential appeared in the publication log" >&2; exit 1; }
          echo "the publisher credential does not appear in the publication log"

      - name: Report the outcome
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
          CANDIDATE_SOURCE: ${{ inputs.candidate_source }}
          DRY_RUN: ${{ inputs.dry_run }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/publish.log"
          {
            echo "## Publication $VERSION"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| result | $JOB_STATUS |"
            echo "| mode | $([ "$DRY_RUN" = true ] && echo 'inspection only (nothing mutated)' || echo 'live publication') |"
            echo "| candidate | $CANDIDATE_SOURCE |"
            echo "| previous version | $PREVIOUS_VERSION (untouched, remains the published fallback) |"
            echo "| credential | release publisher credential (may only touch the release routes) |"
            echo ""
            if [ -f "$log" ]; then
              echo '```'
              # The credential is never in the log (asserted in the step above),
              # so the tail is safe to publish as evidence.
              tail -25 "$log"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the publication log as evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-publish-${{ inputs.version }}-${{ github.run_id }}
          path: ${{ runner.temp }}/publish.log
          if-no-files-found: warn
          retention-days: 90
